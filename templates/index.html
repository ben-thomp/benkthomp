{% extends "base.html" %}

{% block title %}benkthomp{% endblock %}

{% block content %}
<section class="page-section">
  <div class="project-list">
    {% for project in projects %}
    <a href="{{ project_url(project) }}" class="project-card"
       {% if project.repo %}target="_blank" rel="noopener"{% endif %}>
      <div class="project-card-title">{{ project.name }}</div>
      <div class="project-card-desc">{{ project.description }}</div>
      {% if project.language %}<span class="project-card-tag">{{ project.language }}</span>{% endif %}
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
